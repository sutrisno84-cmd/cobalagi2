<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Ujian Terpadu | Pendidikan Pancasila Kelas XI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --primary-hover: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            --danger: #dc2626;
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --text-dark: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text-dark);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            background-color: #0f172a;
        }

        /* Ambient Animated Background (Biru Muda & Biru Tua) */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0b1329 0%, #1e3a8a 50%, #0369a1 100%);
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.65;
            animation: floatOrb 14s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #38bdf8; /* Biru muda terang */
            top: -100px;
            left: -100px;
            animation-duration: 12s;
        }

        .orb-2 {
            width: 550px;
            height: 550px;
            background: #1d4ed8; /* Biru tua dalam */
            bottom: -150px;
            right: -100px;
            animation-duration: 18s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: #60a5fa; /* Biru cerah */
            top: 45%;
            left: 55%;
            animation-duration: 10s;
        }

        .orb-4 {
            width: 300px;
            height: 300px;
            background: #0284c7; /* Biru sedang */
            bottom: 15%;
            left: 10%;
            animation-duration: 16s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.12); }
            100% { transform: translate(-30px, 30px) scale(0.92); }
        }

        /* Main Content Wrapper */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphic Card */
        .card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            padding: 36px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35),
                        0 0 30px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37, 99, 235, 0.08);
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .badge-pill::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #2563eb;
            display: inline-block;
            box-shadow: 0 0 8px #2563eb;
        }

        .logo-wrapper {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .logo-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(56, 189, 248, 0.4);
            filter: blur(30px);
            border-radius: 50%;
            z-index: 0;
        }

        .school-logo {
            position: relative;
            z-index: 1;
            max-width: 110px;
            height: auto;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .school-logo:hover {
            transform: scale(1.08) rotate(-1deg);
        }

        h1 {
            font-size: 23px;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .alert-box {
            background: rgba(254, 242, 242, 0.9);
            border: 1px solid rgba(252, 165, 165, 0.6);
            border-left: 5px solid var(--danger);
            padding: 14px 16px;
            text-align: left;
            margin-bottom: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.05);
        }

        .alert-box strong {
            color: #b91c1c;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 700;
        }

        .alert-box p {
            font-size: 12.5px;
            margin-bottom: 0;
            color: #991b1b;
            line-height: 1.45;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.45);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: var(--danger-gradient);
            color: white;
            box-shadow: 0 8px 20px -4px rgba(220, 38, 38, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(220, 38, 38, 0.55);
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        input[type="text"], select.select-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
            -webkit-user-select: auto;
            user-select: auto;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
        }

        #unlock-code {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        input[type="text"]:focus, select.select-input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        select.select-input {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            background-size: 1.1em;
        }

        #exam-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: white;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            z-index: 100;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        .timer-container {
            display: none;
            position: fixed
